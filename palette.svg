    <rect x="910" y="198" width="195" height="118" rx="14" fill="#0000AA"/><text x="928" y="347" fill="#f1f4f8" font-size="20" font-weight="700">4 · Blue</text><text x="928" y="375" fill="#aab5c5" font-family="DejaVu Sans Mono, monospace" font-size="18">#0000AA</text>
    <rect x="1120" y="198" width="195" height="118" rx="14" fill="#AA00AA"/><text x="1138" y="347" fill="#f1f4f8" font-size="20" font-weight="700">5 · Magenta</text><text x="1138" y="375" fill="#aab5c5" font-family="DejaVu Sans Mono, monospace" font-size="18">#AA00AA</text>
