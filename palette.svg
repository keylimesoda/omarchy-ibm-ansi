<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">
  <rect width="1800" height="700" rx="28" fill="#111722"/>
  <text x="70" y="72" fill="#f1f4f8" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700">IBM PC · CGA/EGA ANSI PALETTE</text>
  <text x="70" y="112" fill="#aab5c5" font-family="DejaVu Sans, sans-serif" font-size="19">The 16 terminal color slots, in ANSI index order</text>
  <text x="70" y="176" fill="#aab5c5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" letter-spacing="2">NORMAL · 0–7</text>
  <text x="70" y="438" fill="#aab5c5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" letter-spacing="2">BRIGHT · 8–15</text>
  <g font-family="DejaVu Sans, sans-serif">
